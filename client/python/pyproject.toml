[project]
name = "nym"
version = "0.0.1"
description = "Identity provider and authentication layer"
readme = "README.md"
license = "Unlicense"
requires-python = ">=3.12"
authors = [{ name = "Gijs6" }]
dependencies = [
    "flask>=3.0",
    "requests>=2.31",
]

[project.urls]
Sources = "https://git.dupunkto.org/~dupunkto/nym"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nym"]

[tool.ruff]
line-length = 100
